app = "clinsafer"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  OPENROUTER_MODEL = "qwen/qwen3.6-flash"
  OPENROUTER_TIMEOUT_SECONDS = "75"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
